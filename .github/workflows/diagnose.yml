name: Diagnose

# Manual diagnostics + targeted fixes for the live deployment, run from GitHub's
# network (the local dev sandbox has no egress). Reports the live status of the
# Railway backend, the Vercel storefront, and the Cloudflare-managed public
# domain, and can apply a few safe fixes gated by the inputs below.
on:
  workflow_dispatch:
    inputs:
      fix_seed_vars:
        description: "Force RUN_SEED=false and RESET_DB=false on the backend service (stops re-seed/wipe on restart)."
        type: choice
        options:
          - "false"
          - "true"
        default: "true"
      set_admin:
        description: "Admin password bootstrap flag on the backend service."
        type: choice
        options:
          - "no"       # leave SET_ADMIN untouched
          - "enable"   # SET_ADMIN=true (+ADMIN creds) so the next boot sets the password
          - "disable"  # SET_ADMIN=false after the password has been set
        default: "no"
      admin_password:
        description: "Password to bootstrap for admin@medusa.local when set_admin=enable."
        required: false
        default: "1212"
      disable_vercel_protection:
        description: "Disable Vercel Deployment Protection (SSO/password) on production so the public can view the site."
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      repro_admin:
        description: "Build the admin on the runner and browser-test it locally (offline repro + bisect of the blank /app)."
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

concurrency:
  group: diagnose-production
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_NAME: modn-website
  RAILWAY_BACKEND_SERVICE: backend
  RAILWAY_GRAPHQL: https://backboard.railway.com/graphql/v2
  VERCEL_PROJECT_NAME: modn-storefront
  PUBLIC_DOMAIN: kr.respectathletic.com

jobs:
  diagnose:
    name: Diagnose live deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ---------------------------------------------------------------------
      # RAILWAY: resolve ids, report deployment status + variables + logs, and
      # apply the seed/admin variable fixes.
      # ---------------------------------------------------------------------
      - name: Railway diagnose + fix
        id: railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          FIX_SEED: ${{ github.event.inputs.fix_seed_vars }}
          SET_ADMIN_MODE: ${{ github.event.inputs.set_admin }}
          ADMIN_PW: ${{ github.event.inputs.admin_password }}
        run: |
          set -uo pipefail
          gql() {
            curl -sS -X POST "$RAILWAY_GRAPHQL" \
              -H "Authorization: Bearer ${RAILWAY_API_TOKEN}" \
              -H "Content-Type: application/json" --data "$1"
          }
          scrub() { sed 's/Bearer [^"]*/Bearer ***/g'; }

          echo "== Resolving project / environment / backend service =="
          RESP="$(gql '{"query":"query { projects { edges { node { id name } } } }"}')"
          PROJECT_ID="$(echo "$RESP" | jq -r --arg n "$RAILWAY_PROJECT_NAME" '[.data.projects.edges[].node | select(.name==$n) | .id][0] // ""')"
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Could not resolve Railway project $RAILWAY_PROJECT_NAME."
            echo "$RESP" | scrub | head -c 500; exit 1
          fi
          PBODY="$(jq -n --arg id "$PROJECT_ID" '{query:"query($id: String!){ project(id:$id){ environments { edges { node { id name } } } services { edges { node { id name } } } } }", variables:{id:$id}}')"
          PROJ="$(gql "$PBODY")"
          ENV_ID="$(echo "$PROJ" | jq -r '[.data.project.environments.edges[].node | select(.name=="production") | .id][0] // .data.project.environments.edges[0].node.id // ""')"
          SVC_ID="$(echo "$PROJ" | jq -r --arg n "$RAILWAY_BACKEND_SERVICE" '[.data.project.services.edges[].node | select(.name==$n) | .id][0] // ""')"
          echo "project=$PROJECT_ID env=$ENV_ID backend=$SVC_ID"
          [ -z "$ENV_ID" ] || [ -z "$SVC_ID" ] && { echo "::error::Missing env or backend service id."; exit 1; }

          echo ""
          echo "== Current backend service variables (seed/admin flags) =="
          VBODY="$(jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SVC_ID" '{query:"query($p:String!,$e:String!,$s:String!){ variables(projectId:$p, environmentId:$e, serviceId:$s) }", variables:{p:$p,e:$e,s:$s}}')"
          VARS="$(gql "$VBODY" | jq '.data.variables // {}')"
          echo "$VARS" > vars.json
          echo "  RUN_SEED   = $(echo "$VARS" | jq -r '.RUN_SEED   // "(unset)"')"
          echo "  RESET_DB   = $(echo "$VARS" | jq -r '.RESET_DB   // "(unset)"')"
          echo "  SET_ADMIN  = $(echo "$VARS" | jq -r '.SET_ADMIN  // "(unset)"')"
          echo "  ADMIN_EMAIL= $(echo "$VARS" | jq -r '.ADMIN_EMAIL // "(unset)"')"

          echo ""
          echo "== Latest backend deployment status =="
          DBODY="$(jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SVC_ID" '{query:"query($p:String!,$e:String!,$s:String!){ deployments(first:3, input:{projectId:$p, environmentId:$e, serviceId:$s}){ edges { node { id status createdAt } } } }", variables:{p:$p,e:$e,s:$s}}')"
          DRESP="$(gql "$DBODY")"
          echo "$DRESP" | jq -r '.data.deployments.edges[]?.node | "  \(.createdAt)  \(.status)  \(.id)"' 2>/dev/null || echo "$DRESP" | scrub | head -c 400
          DEP_ID="$(echo "$DRESP" | jq -r '.data.deployments.edges[0].node.id // ""')"
          DEP_STATUS="$(echo "$DRESP" | jq -r '.data.deployments.edges[0].node.status // ""')"
          echo "  -> latest status: $DEP_STATUS"

          if [ -n "$DEP_ID" ]; then
            echo ""
            echo "== Backend runtime logs (tail) =="
            LBODY="$(jq -n --arg d "$DEP_ID" '{query:"query($d:String!){ deploymentLogs(deploymentId:$d, limit:200){ message severity } }", variables:{d:$d}}')"
            gql "$LBODY" | jq -r '.data.deploymentLogs[]?.message // empty' 2>/dev/null | tail -n 120 || true
          fi

          # -- Apply fixes ----------------------------------------------------
          upsert() {
            local NAME="$1"; local VALUE="$2"
            local B RESP
            B="$(jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SVC_ID" --arg name "$NAME" --arg value "$VALUE" '{query:"mutation($input: VariableUpsertInput!){ variableUpsert(input:$input) }", variables:{input:{projectId:$p, environmentId:$e, serviceId:$s, name:$name, value:$value}}}')"
            RESP="$(gql "$B")"
            if echo "$RESP" | jq -e '.errors' >/dev/null 2>&1; then
              echo "::error::Failed to set $NAME"; echo "$RESP" | scrub; exit 1
            fi
            echo "  set $NAME=$VALUE"
          }

          if [ "${FIX_SEED:-false}" = "true" ]; then
            echo ""
            echo "== Forcing RUN_SEED=false, RESET_DB=false =="
            upsert RUN_SEED "false"
            upsert RESET_DB "false"
          fi

          if [ "${SET_ADMIN_MODE:-no}" = "enable" ]; then
            echo ""
            echo "== Enabling SET_ADMIN bootstrap (admin@medusa.local) =="
            upsert ADMIN_EMAIL "admin@medusa.local"
            upsert ADMIN_PASSWORD "${ADMIN_PW:-1212}"
            upsert SET_ADMIN "true"
          elif [ "${SET_ADMIN_MODE:-no}" = "disable" ]; then
            echo ""
            echo "== Disabling SET_ADMIN bootstrap =="
            upsert SET_ADMIN "false"
          fi

          {
            echo "backend_status=$DEP_STATUS"
          } >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Public backend endpoints from the GitHub runner.
      # ---------------------------------------------------------------------
      - name: Curl backend /health and /app
        run: |
          set -uo pipefail
          BASE="https://backend-production-93dc.up.railway.app"
          probe() {
            local URL="$1"
            local CODE
            CODE="$(curl -s -m 20 -o body.out -w '%{http_code}' "$URL" || echo 000)"
            echo "----- GET $URL -> HTTP $CODE -----"
            head -c 400 body.out 2>/dev/null; echo ""
          }
          probe "$BASE/health"
          probe "$BASE/app"

      # ---------------------------------------------------------------------
      # VERCEL: production URL, deployment protection status, optional disable.
      # ---------------------------------------------------------------------
      - name: Vercel diagnose + protection
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DISABLE_PROT: ${{ github.event.inputs.disable_vercel_protection }}
        run: |
          set -uo pipefail
          npm i -g vercel@latest >/dev/null 2>&1 || npm i -g vercel@latest
          echo "== Linking Vercel project (read-only) =="
          vercel link --yes --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          ORG_ID=""; PROJ_ID=""
          if [ -f .vercel/project.json ]; then
            ORG_ID="$(jq -r '.orgId' .vercel/project.json)"
            PROJ_ID="$(jq -r '.projectId' .vercel/project.json)"
          fi
          echo "org=$ORG_ID project=$PROJ_ID"
          TEAM_Q=""
          case "$ORG_ID" in team_*) TEAM_Q="&teamId=${ORG_ID}";; esac
          api() { curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" "$@"; }

          echo ""
          echo "== Deployment Protection status =="
          PROJ="$(api "https://api.vercel.com/v9/projects/${PROJ_ID}?x=1${TEAM_Q}")"
          echo "  ssoProtection      = $(echo "$PROJ" | jq -c '.ssoProtection // null')"
          echo "  passwordProtection = $(echo "$PROJ" | jq -c '.passwordProtection // null')"

          if [ "${DISABLE_PROT:-false}" = "true" ]; then
            echo ""
            echo "== Disabling Deployment Protection (ssoProtection+passwordProtection=null) =="
            RESP="$(curl -sS -X PATCH -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Content-Type: application/json" \
              --data '{"ssoProtection":null,"passwordProtection":null}' \
              "https://api.vercel.com/v9/projects/${PROJ_ID}?x=1${TEAM_Q}")"
            echo "  ssoProtection      = $(echo "$RESP" | jq -c '.ssoProtection // null')"
            echo "  passwordProtection = $(echo "$RESP" | jq -c '.passwordProtection // null')"
          fi

          echo ""
          echo "== Latest READY production deployment =="
          DEPS="$(api "https://api.vercel.com/v6/deployments?projectId=${PROJ_ID}&target=production&limit=3${TEAM_Q}")"
          PROD_URL="$(echo "$DEPS" | jq -r '[.deployments[]? | select(.state=="READY")][0].url // .deployments[0].url // ""')"
          echo "  production deployment host: ${PROD_URL:-(none)}"
          if [ -n "$PROD_URL" ]; then
            CODE="$(curl -s -m 25 -o vbody.out -w '%{http_code}' "https://${PROD_URL}" || echo 000)"
            echo "----- GET https://${PROD_URL} -> HTTP $CODE -----"
            head -c 300 vbody.out; echo ""
          fi

      # ---------------------------------------------------------------------
      # CLOUDFLARE + public domain: DNS record + SSL/HTTP status.
      # ---------------------------------------------------------------------
      - name: Cloudflare DNS + public domain
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          ZONE="respectathletic.com"
          api() { curl -sS -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" "$@"; }
          echo "== Cloudflare DNS for ${PUBLIC_DOMAIN} =="
          ZID="$(api "https://api.cloudflare.com/client/v4/zones?name=${ZONE}" | jq -r '.result[0].id // ""')"
          if [ -z "$ZID" ]; then
            echo "::warning::Zone ${ZONE} not found or token not scoped."
          else
            api "https://api.cloudflare.com/client/v4/zones/${ZID}/dns_records?name=${PUBLIC_DOMAIN}" \
              | jq -r '.result[]? | "  \(.type)  \(.name) -> \(.content)  (proxied=\(.proxied))"'
          fi
          echo ""
          echo "== Public resolution + SSL =="
          echo "  DNS: $(getent hosts "$PUBLIC_DOMAIN" || echo '(no resolution)')"
          CODE="$(curl -s -m 25 -o kbody.out -w '%{http_code}' "https://${PUBLIC_DOMAIN}" 2>curlerr.out || echo 000)"
          echo "----- GET https://${PUBLIC_DOMAIN} -> HTTP $CODE -----"
          if [ "$CODE" = "000" ]; then echo "  curl error: $(head -c 200 curlerr.out)"; fi
          head -c 300 kbody.out 2>/dev/null; echo ""

      - name: Summary
        if: always()
        run: |
          {
            echo "## Diagnose run"
            echo "- Backend latest deployment status: ${{ steps.railway.outputs.backend_status }}"
            echo "- See step logs above for /health, /app, Vercel production, and ${PUBLIC_DOMAIN} results."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # BROWSER RENDER CHECK: prove whether the admin SPA at /app actually renders
  # in a real headless Chromium (HTTP 200 only means the HTML shell loaded).
  # Extracts + probes the referenced admin assets for 404s, then loads the page
  # and collects console messages, page errors and failed requests — the real
  # signal for a blank admin. Runs independently so it always executes.
  # ---------------------------------------------------------------------------
  browser-check:
    name: Browser render check (/app)
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch /app HTML and probe referenced assets
        run: |
          set -uo pipefail
          BASE="https://backend-production-93dc.up.railway.app"
          echo "== GET $BASE/app =="
          curl -sSL -m 30 "$BASE/app" -o app.html -w 'HTTP %{http_code}  size=%{size_download}\n' || echo "curl failed"
          echo "----- app.html -----"
          cat app.html; echo ""
          echo "----- referenced <script src> / <link href> assets -----"
          grep -oE '(src|href)="[^"]+"' app.html \
            | sed -E 's/^(src|href)="//; s/"$//' | sort -u > assets.txt
          cat assets.txt
          echo "----- asset HTTP status (find 404s) -----"
          while read -r a; do
            [ -z "$a" ] && continue
            case "$a" in
              http*) URL="$a";;
              /*)    URL="$BASE$a";;
              *)     URL="$BASE/app/$a";;
            esac
            CT="$(curl -s -m 25 -o /dev/null -w '%{http_code} %{content_type}' "$URL" || echo '000 -')"
            echo "  $CT  $URL"
          done < assets.txt

      - name: Playwright headless render check
        run: |
          set -uo pipefail
          npm init -y >/dev/null 2>&1 || true
          npm i -D playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const BASE = 'https://backend-production-93dc.up.railway.app';
          const consoleMsgs = [], pageErrors = [], failed = [];
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
          page.on('console', m => consoleMsgs.push(`[${m.type()}] ${m.text()}`));
          page.on('pageerror', e => pageErrors.push(String(e && e.stack || e)));
          page.on('requestfailed', r => failed.push(`REQFAIL ${r.failure()?.errorText || ''} ${r.url()}`));
          page.on('response', r => { if (r.status() >= 400) failed.push(`HTTP ${r.status()} ${r.url()}`); });
          try {
            await page.goto(BASE + '/app', { waitUntil: 'networkidle', timeout: 60000 });
          } catch (e) { pageErrors.push('goto: ' + String(e)); }
          await page.waitForTimeout(9000);
          const finalUrl = page.url();
          const bodyText = await page.evaluate(() => document.body ? document.body.innerText : '(no body)');
          const probe = await page.evaluate(() => ({
            emailInputs: document.querySelectorAll('input[type=email],input[name=email]').length,
            passwordInputs: document.querySelectorAll('input[type=password],input[name=password]').length,
            totalInputs: document.querySelectorAll('input').length,
            buttons: document.querySelectorAll('button').length,
            rootChildren: (document.getElementById('medusa') || document.querySelector('#root') || document.body).children.length,
            title: document.title,
          }));
          await page.screenshot({ path: 'admin.jpg', type: 'jpeg', quality: 55 });
          console.log('=== FINAL URL ===', finalUrl);
          console.log('=== TITLE ===', probe.title);
          console.log('=== BODY INNERTEXT LENGTH ===', bodyText.length);
          console.log('=== BODY INNERTEXT (first 600) ===\n' + bodyText.slice(0, 600));
          console.log('=== DOM PROBE ===', JSON.stringify(probe));
          const rendered = probe.emailInputs > 0 && probe.passwordInputs > 0 && bodyText.length > 20;
          console.log('=== RENDER VERDICT ===', rendered ? 'LOGIN_FORM_RENDERED' : 'BLANK_OR_NO_LOGIN');
          console.log('=== CONSOLE MESSAGES (' + consoleMsgs.length + ') ===');
          consoleMsgs.forEach(m => console.log(m));
          console.log('=== PAGE ERRORS (' + pageErrors.length + ') ===');
          pageErrors.forEach(m => console.log(m));
          console.log('=== FAILED / 4xx-5xx REQUESTS ===');
          [...new Set(failed)].forEach(m => console.log(m));
          await browser.close();
          EOF
          node check.mjs
          echo "=====SCREENSHOT_B64_START====="
          base64 -w0 admin.jpg
          echo ""
          echo "=====SCREENSHOT_B64_END====="

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-screenshot
          path: admin.jpg
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # OFFLINE ADMIN RENDER REPRO + BISECT (gated by repro_admin=true).
  # Builds the admin from the repo source ON the runner, serves the static admin
  # output at /app on localhost, and browser-tests it — reproducing the blank
  # /app without any Railway deploy. Then rebuilds with the custom admin
  # extensions (src/admin/widgets + src/admin/i18n) removed and re-tests, to
  # prove whether that custom code is the cause of the React render crash.
  # ---------------------------------------------------------------------------
  render-repro:
    name: Offline admin render repro (before/after fix)
    if: ${{ github.event.inputs.repro_admin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Install deps (as the Docker build does; react@19 hoisted)"
        working-directory: backend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: backend/apps/backend
        run: |
          npm i playwright@latest --no-save
          npx playwright install --with-deps chromium

      # Scripts live in backend/apps/backend so `import 'playwright'` resolves
      # from that package's node_modules (Node ESM resolves bare specifiers from
      # the importing file's location, not the cwd).
      - name: Write render-check + serve scripts
        working-directory: backend/apps/backend
        run: |
          cat > render-check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const URL = process.argv[2];
          const LABEL = process.argv[3] || 'check';
          const consoleMsgs = [], pageErrors = [];
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
          page.on('console', m => consoleMsgs.push(`[${m.type()}] ${m.text()}`));
          page.on('pageerror', e => pageErrors.push(String(e && e.stack || e)));
          try { await page.goto(URL, { waitUntil: 'networkidle', timeout: 45000 }); }
          catch (e) { pageErrors.push('goto: ' + String(e)); }
          await page.waitForTimeout(7000);
          const bodyText = await page.evaluate(() => document.body ? document.body.innerText : '(no body)');
          const probe = await page.evaluate(() => ({
            emailInputs: document.querySelectorAll('input[type=email],input[name=email]').length,
            passwordInputs: document.querySelectorAll('input[type=password],input[name=password]').length,
            totalInputs: document.querySelectorAll('input').length,
            buttons: document.querySelectorAll('button').length,
            rootChildren: (document.getElementById('medusa') || document.body).children.length,
          }));
          await page.screenshot({ path: `admin-${LABEL}.jpg`, type: 'jpeg', quality: 55 });
          const rendered = probe.passwordInputs > 0 && bodyText.length > 20;
          console.log(`===== [${LABEL}] URL ${URL}`);
          console.log(`[${LABEL}] BODY_LEN=${bodyText.length} PROBE=${JSON.stringify(probe)}`);
          console.log(`[${LABEL}] VERDICT=${rendered ? 'RENDERED_LOGIN' : 'BLANK_OR_NO_LOGIN'}`);
          console.log(`[${LABEL}] BODY_TEXT(0..200)=${bodyText.slice(0,200).replace(/\n/g,' ')}`);
          const reactChild = [...consoleMsgs, ...pageErrors].some(m => /not valid as a React child/.test(m));
          console.log(`[${LABEL}] REACT_CHILD_ERROR=${reactChild}`);
          console.log(`[${LABEL}] PAGE_ERRORS(${pageErrors.length}):`);
          pageErrors.forEach(m => console.log('  ' + m.split('\n')[0]));
          console.log(`[${LABEL}] CONSOLE_ERRORS:`);
          consoleMsgs.filter(m => m.startsWith('[error]')).forEach(m => console.log('  ' + m.split('\n')[0]));
          await browser.close();
          EOF
          cat > serve.mjs <<'EOF'
          import http from 'http';
          import { readFile, stat } from 'fs/promises';
          import { extname, join, normalize } from 'path';
          const ROOT = process.argv[2]; const PORT = +process.argv[3];
          const TYPES = { '.js':'text/javascript','.css':'text/css','.html':'text/html','.json':'application/json','.ttf':'font/ttf','.svg':'image/svg+xml','.png':'image/png','.ico':'image/x-icon','.woff':'font/woff','.woff2':'font/woff2' };
          // Static admin lives at ROOT and is referenced under /app. Map /app -> ROOT.
          http.createServer(async (req, res) => {
            try {
              let p = decodeURIComponent(req.url.split('?')[0]);
              if (p.startsWith('/app')) p = p.slice(4) || '/';
              let fp = normalize(join(ROOT, p));
              try { const s = await stat(fp); if (s.isDirectory()) fp = join(fp, 'index.html'); }
              catch { fp = join(ROOT, 'index.html'); } // SPA fallback
              const buf = await readFile(fp);
              res.writeHead(200, { 'content-type': TYPES[extname(fp)] || 'application/octet-stream' });
              res.end(buf);
            } catch { res.writeHead(404); res.end('nf'); }
          }).listen(PORT, () => console.log('serving', ROOT, 'on', PORT));
          EOF
          echo "scripts written"

      - name: CONTROL — current install (react@19 hoisted) reproduces blank /app
        working-directory: backend/apps/backend
        run: |
          set -uo pipefail
          echo "root react = $(node -p "require('../../node_modules/react/package.json').version" 2>/dev/null || echo '?')"
          npx medusa build
          rm -rf /tmp/adminCtl && cp -r .medusa/server/public/admin /tmp/adminCtl
          node serve.mjs /tmp/adminCtl 8081 &
          sleep 2
          node render-check.mjs "http://localhost:8081/app" CONTROL || true

      - name: FIX — backend-only + react override (as Dockerfile does) renders login
        working-directory: backend
        run: |
          set -uo pipefail
          # Faithfully simulate the Docker builder's CLEAN layer: wipe any
          # node_modules from the CONTROL step so npm fully re-resolves react.
          rm -rf node_modules apps/backend/node_modules apps/storefront/node_modules package-lock.json
          node -e "const fs=require('fs');const p=require('./package.json');p.workspaces=['apps/backend'];p.overrides=Object.assign({},p.overrides,{react:'18.3.1','react-dom':'18.3.1'});fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          npm install --no-audit --no-fund
          echo "root react = $(node -p "require('./node_modules/react/package.json').version" 2>/dev/null || echo '?')"
          echo "react copies found:"; find . -path '*/node_modules/react/package.json' -not -path '*/.medusa/*' 2>/dev/null || true
          cd apps/backend
          npm i playwright@latest --no-save
          npx medusa build
          rm -rf /tmp/adminFix && cp -r .medusa/server/public/admin /tmp/adminFix
          node serve.mjs /tmp/adminFix 8082 &
          sleep 2
          node render-check.mjs "http://localhost:8082/app" FIX || true

      - name: Upload repro screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-screenshots
          path: backend/apps/backend/admin-*.jpg
          if-no-files-found: warn
